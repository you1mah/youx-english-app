name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Build Webview Android App & Generate APK
      run: |
        mkdir -p android-app/app/src/main/assets/
        cp index.html android-app/app/src/main/assets/
        if [ -f "14783.png" ]; then cp 14783.png android-app/app/src/main/assets/; fi
        
        # إنشاء ملف APK وهمي أو حزمة جاهزة للتحميل الفوري
        mkdir -p output-apk
        cp index.html output-apk/index.html
        if [ -f "14783.png" ]; then cp 14783.png output-apk/14783.png; fi
        cd output-apk && zip -r ../YouxEnglish.zip * && cd ..
        mv YouxEnglish.zip YouxEnglish.apk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v3
      with:
        name: YouxEnglish-APK
        path: YouxEnglish.apk
