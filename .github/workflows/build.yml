name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Package Web App Files
      run: |
        mkdir -p app-files
        cp index.html app-files/
        if [ -f "14783.png" ]; then cp 14783.png app-files/; fi
        cd app-files && zip -r ../YouxEnglish-App.zip * && cd ..

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v3
      with:
        name: YouxEnglish-App
        path: YouxEnglish-App.zip
