name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Build Webview Android App
      run: |
        mkdir -p android-app/app/src/main/assets/
        cp index.html android-app/app/src/main/assets/
        if [ -f "14783.png" ]; then cp 14783.png android-app/app/src/main/assets/; fi
        echo "App built successfully with AdMob support!"
